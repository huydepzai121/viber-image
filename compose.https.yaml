services:
  app:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${DOMAIN:?Set DOMAIN, e.g. DOMAIN=example.com} --to app:5173
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
